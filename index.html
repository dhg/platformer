<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Platformer Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; color: #ddd; }
  #wrap { position: relative; }
  canvas { display: block; background: #6cb4ff; image-rendering: pixelated; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #hud {
    position: absolute; top: 8px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; pointer-events: none;
    font: 12px/1 ui-monospace, monospace; color: #fff;
    text-shadow: 1px 1px 0 #000;
  }
  #help { position: absolute; bottom: 8px; left: 12px; font: 11px/1.4 ui-monospace, monospace; color: #fff; text-shadow: 1px 1px 0 #000; opacity: .85; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud"><span id="status">—</span><span id="debug"></span></div>
  <div id="help">← → / A D : move &nbsp;·&nbsp; W / ↑ : jump (hold for higher) &nbsp;·&nbsp; Space : rewind (30s) &nbsp;·&nbsp; R : reset &nbsp;·&nbsp; ` : debug</div>
</div>
<script>
(() => {
  // ---------- Constants (tune these) ----------
  const TILE = 32;
  const VIEW_W = 960, VIEW_H = 540;

  // Movement
  const MOVE_ACCEL     = 1800;   // px/s^2 ground
  const AIR_ACCEL      = 1400;   // px/s^2 air
  const MAX_RUN_SPEED  = 260;    // px/s
  const GROUND_FRICTION = 1600;  // px/s^2 when no input
  const TURN_BOOST     = 3.0;    // multiplier when reversing direction

  // Jump
  const GRAVITY        = 2200;   // px/s^2
  const FALL_GRAVITY   = 2800;   // stronger when falling -> snappier
  const LOW_JUMP_GRAV  = 3400;   // when jump released early
  const JUMP_VELOCITY  = 720;    // initial upward velocity
  const MAX_FALL_SPEED = 900;
  const COYOTE_TIME    = 0.10;   // s after leaving ground you can still jump
  const JUMP_BUFFER    = 0.12;   // s before landing you can press jump

  // Rewind
  const HISTORY_SIZE   = 1800;   // ~30s @ 60fps

  // ---------- Level ----------
  // Legend:
  //   . empty   # solid block   = one-way (top-only) platform
  //   P player spawn            G goal flag
  //   (pits are just gaps in the floor)
  const LEVEL = [
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    "................................................................................................",
    ".........................................====.......................====........................",
    ".......P.......................................................................................G",
    "................................................................................................",
    "###############....#####################.......####################......#######################",
    "###############....#####################.......####################......#######################",
    "###############....#####################.......####################......#######################",
    "###############....#####################.......####################......#######################",
    "###############....#####################.......####################......#######################",
    "###############....#####################.......####################......#######################",
  ];

  const LEVEL_W = LEVEL[0].length * TILE;
  const LEVEL_H = LEVEL.length * TILE;

  // Build solid + one-way arrays for fast collision
  const solids = [];   // {x,y,w,h}
  const oneways = [];  // top-only
  let spawn = { x: 64, y: 64 };
  let goal  = null;
  for (let r = 0; r < LEVEL.length; r++) {
    for (let c = 0; c < LEVEL[r].length; c++) {
      const ch = LEVEL[r][c];
      const x = c * TILE, y = r * TILE;
      if (ch === '#') solids.push({ x, y, w: TILE, h: TILE });
      else if (ch === '=') oneways.push({ x, y, w: TILE, h: 8 });
      else if (ch === 'P') spawn = { x: x + 4, y: y };
      else if (ch === 'G') goal = { x, y, w: TILE, h: TILE * 2 };
    }
  }

  // Merge horizontally adjacent solids in the same row to reduce checks (and seams)
  // (cheap pass — O(n^2) is fine for prototype)
  solids.sort((a, b) => a.y - b.y || a.x - b.x);
  const merged = [];
  for (const s of solids) {
    const last = merged[merged.length - 1];
    if (last && last.y === s.y && last.h === s.h && last.x + last.w === s.x) {
      last.w += s.w;
    } else {
      merged.push({ ...s });
    }
  }

  // ---------- Player ----------
  const player = {
    x: spawn.x, y: spawn.y,
    w: 24, h: 32,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    coyote: 0,
    jumpBuffer: 0,
    jumpHeld: false,
    dead: false,
    won: false,
  };

  function resetPlayer() {
    player.x = spawn.x; player.y = spawn.y;
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    player.coyote = 0; player.jumpBuffer = 0;
    player.dead = false; player.won = false;
    clearHistory();
    ghost = null;
    pendingRewindSnapshots = null;
    confetti.length = 0;
  }

  // ---------- Rewind buffer ----------
  // Circular buffer of player snapshots, one per update tick.
  const history = new Array(HISTORY_SIZE);
  let hHead = 0, hCount = 0;
  let rewinding = false;

  function pushHistory() {
    history[hHead] = {
      x: player.x, y: player.y,
      vx: player.vx, vy: player.vy,
      facing: player.facing,
      onGround: player.onGround,
      jumpHeld: player.jumpHeld,
      coyote: player.coyote,
      jumpBuffer: player.jumpBuffer,
      won: player.won,
      dead: player.dead,
    };
    hHead = (hHead + 1) % HISTORY_SIZE;
    if (hCount < HISTORY_SIZE) hCount++;
  }

  function popHistory() {
    if (hCount === 0) return null;
    hHead = (hHead - 1 + HISTORY_SIZE) % HISTORY_SIZE;
    hCount--;
    return history[hHead];
  }

  function clearHistory() { hHead = 0; hCount = 0; }

  // ---------- Ghost replay ----------
  // After a rewind ends, the snapshots we rewound through become a ghost that replays forward.
  // The ghost is non-solid (50% alpha) until it stops overlapping the player, then solid (100%).
  // At end of the path it bursts into confetti. Starting a new rewind cancels the current ghost.
  let ghost = null;                 // { path, index, x, y, facing, solid }
  let pendingRewindSnapshots = null;// collected during rewind, becomes ghost.path on release
  const confetti = [];              // {x,y,vx,vy,color,life,rot,vrot}

  function spawnConfetti(cx, cy) {
    const colors = ['#ff5252', '#ffd54f', '#69f0ae', '#40c4ff', '#ea80fc', '#ffab40', '#fff'];
    for (let i = 0; i < 36; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 120 + Math.random() * 240;
      confetti.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 140,
        color: colors[(Math.random() * colors.length) | 0],
        life: 0.9 + Math.random() * 0.5,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 18,
      });
    }
  }

  function updateConfetti(dt) {
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += 1400 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      p.life -= dt;
      if (p.life <= 0) confetti.splice(i, 1);
    }
  }

  // Push player out of a moving solid (used when ghost moves into stationary player).
  function pushPlayerOutOf(rect) {
    const ox = Math.min(player.x + player.w, rect.x + rect.w) - Math.max(player.x, rect.x);
    const oy = Math.min(player.y + player.h, rect.y + rect.h) - Math.max(player.y, rect.y);
    if (ox <= 0 || oy <= 0) return;
    if (ox < oy) {
      if (player.x + player.w / 2 < rect.x + rect.w / 2) player.x = rect.x - player.w;
      else player.x = rect.x + rect.w;
      player.vx = 0;
    } else {
      if (player.y + player.h / 2 < rect.y + rect.h / 2) {
        player.y = rect.y - player.h;
        if (player.vy > 0) player.vy = 0;
        player.onGround = true;
      } else {
        player.y = rect.y + rect.h;
        if (player.vy < 0) player.vy = 0;
      }
    }
  }

  // ---------- Input ----------
  const keys = new Set();
  let debug = false;
  addEventListener('keydown', e => {
    if (e.repeat) return;
    keys.add(e.code);
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      player.jumpBuffer = JUMP_BUFFER;
      player.jumpHeld = true;
    }
    if (e.code === 'KeyR') resetPlayer();
    if (e.code === 'Backquote') debug = !debug;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e => {
    keys.delete(e.code);
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      player.jumpHeld = false;
    }
  });

  // ---------- Collision helpers ----------
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Move player on one axis, resolving collisions.
  function moveAxis(dx, dy) {
    player.x += dx; player.y += dy;
    const box = player;

    // Solid blocks: resolve on both axes
    for (const s of merged) {
      if (!overlaps(box, s)) continue;
      if (dx > 0) { box.x = s.x - box.w; player.vx = 0; }
      else if (dx < 0) { box.x = s.x + s.w; player.vx = 0; }
      else if (dy > 0) { box.y = s.y - box.h; player.vy = 0; player.onGround = true; }
      else if (dy < 0) { box.y = s.y + s.h; player.vy = 0; }
    }

    // Solid ghost: same resolution as a static solid, but only when ghost has solidified
    if (ghost && ghost.solid) {
      const gr = { x: ghost.x, y: ghost.y, w: player.w, h: player.h };
      if (overlaps(box, gr)) {
        if (dx > 0) { box.x = gr.x - box.w; player.vx = 0; }
        else if (dx < 0) { box.x = gr.x + gr.w; player.vx = 0; }
        else if (dy > 0) { box.y = gr.y - box.h; player.vy = 0; player.onGround = true; }
        else if (dy < 0) { box.y = gr.y + gr.h; player.vy = 0; }
      }
    }

    // One-way platforms: only resolve when moving down and feet were above the platform top
    if (dy > 0) {
      for (const p of oneways) {
        if (!overlaps(box, p)) continue;
        // feet were above the platform top before this step?
        const prevFeet = box.y + box.h - dy;
        if (prevFeet <= p.y + 0.5) {
          box.y = p.y - box.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }
  }

  // ---------- Update ----------
  function update(dt) {
    updateConfetti(dt);

    const rewindHeld = keys.has('Space');
    const startedRewinding = rewindHeld && !rewinding;
    const stoppedRewinding = !rewindHeld && rewinding;

    // Starting a rewind cancels any active ghost and begins collecting snapshots.
    if (startedRewinding) {
      ghost = null;
      pendingRewindSnapshots = [];
    }

    // Releasing rewind turns the collected snapshots into a forward-playing ghost.
    if (stoppedRewinding && pendingRewindSnapshots && pendingRewindSnapshots.length > 0) {
      pendingRewindSnapshots.reverse();
      const first = pendingRewindSnapshots[0];
      ghost = {
        path: pendingRewindSnapshots,
        index: 0,
        x: first.x, y: first.y,
        facing: first.facing,
        solid: false,
      };
      pendingRewindSnapshots = null;
    }

    rewinding = rewindHeld;

    // Rewind: Space overrides everything. Pop one snapshot per tick, freeze when buffer is empty.
    if (rewinding) {
      const snap = popHistory();
      if (snap) {
        pendingRewindSnapshots.push(snap);
        player.x = snap.x; player.y = snap.y;
        player.vx = snap.vx; player.vy = snap.vy;
        player.facing = snap.facing;
        player.onGround = snap.onGround;
        player.jumpHeld = snap.jumpHeld;
        player.coyote = snap.coyote;
        player.jumpBuffer = snap.jumpBuffer;
        player.won = snap.won;
        player.dead = snap.dead;
      }
      return;
    }

    // Advance ghost along its replay path.
    if (ghost) {
      if (ghost.index >= ghost.path.length) {
        spawnConfetti(ghost.x + player.w / 2, ghost.y + player.h / 2);
        ghost = null;
      } else {
        const prevX = ghost.x, prevY = ghost.y;
        // Was the player riding the ghost's head at end of last frame? (Dead players don't ride.)
        const wasOnGhost = !player.dead && ghost.solid &&
          player.onGround &&
          Math.abs((player.y + player.h) - prevY) < 2 &&
          player.x < prevX + player.w &&
          player.x + player.w > prevX;

        const g = ghost.path[ghost.index++];
        ghost.x = g.x; ghost.y = g.y; ghost.facing = g.facing;

        if (!player.dead) {
          const gr = { x: ghost.x, y: ghost.y, w: player.w, h: player.h };
          if (!ghost.solid) {
            if (!overlaps(player, gr)) ghost.solid = true;
          } else if (wasOnGhost) {
            // Carry the rider along with the ghost; route through moveAxis so terrain still blocks.
            const gdx = ghost.x - prevX;
            const gdy = ghost.y - prevY;
            if (gdx !== 0) moveAxis(gdx, 0);
            if (gdy !== 0) moveAxis(0, gdy);
          } else if (overlaps(player, gr)) {
            // Ghost moved into stationary player — push player out along smallest overlap axis.
            pushPlayerOutOf(gr);
          }
        }
      }
    }

    // Dead: frozen until the player rewinds. Don't run physics, don't grow history.
    if (player.dead) return;

    if (player.won) { pushHistory(); return; }

    const left  = keys.has('ArrowLeft')  || keys.has('KeyA');
    const right = keys.has('ArrowRight') || keys.has('KeyD');
    const dir = (right ? 1 : 0) - (left ? 1 : 0);

    // Horizontal accel
    const accel = player.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (dir !== 0) {
      player.facing = dir;
      // Boost when reversing for snappy feel
      const reversing = (dir > 0 && player.vx < 0) || (dir < 0 && player.vx > 0);
      const a = accel * (reversing ? TURN_BOOST : 1);
      player.vx += dir * a * dt;
      player.vx = Math.max(-MAX_RUN_SPEED, Math.min(MAX_RUN_SPEED, player.vx));
    } else if (player.onGround) {
      // Friction
      const sign = Math.sign(player.vx);
      const drop = GROUND_FRICTION * dt;
      if (Math.abs(player.vx) <= drop) player.vx = 0;
      else player.vx -= sign * drop;
    }

    // Coyote + jump buffer
    if (player.onGround) player.coyote = COYOTE_TIME;
    else player.coyote = Math.max(0, player.coyote - dt);
    player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);

    if (player.jumpBuffer > 0 && player.coyote > 0) {
      player.vy = -JUMP_VELOCITY;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
    }

    // Variable gravity: low-jump cut, snappier fall
    let g = GRAVITY;
    if (player.vy < 0 && !player.jumpHeld) g = LOW_JUMP_GRAV;
    else if (player.vy > 0) g = FALL_GRAVITY;
    player.vy += g * dt;
    if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;

    // Move (resolve X then Y so corners feel right)
    player.onGround = false;
    moveAxis(player.vx * dt, 0);
    moveAxis(0, player.vy * dt);

    // Pit: burst into confetti and freeze. Player rewinds to undo (Space).
    if (player.y + player.h > LEVEL_H) {
      player.dead = true;
      spawnConfetti(player.x + player.w / 2, player.y + player.h / 2);
      return;  // skip pushHistory so the last alive frame stays at the top of the buffer
    }
    if (player.x < 0) { player.x = 0; if (player.vx < 0) player.vx = 0; }
    if (player.x + player.w > LEVEL_W) {
      player.x = LEVEL_W - player.w;
      if (player.vx > 0) player.vx = 0;
    }

    // Goal
    if (goal && overlaps(player, goal)) player.won = true;

    pushHistory();
  }

  // ---------- Render ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let camX = 0, camY = 0;
  function updateCamera() {
    // Center on player with deadzone clamping to level bounds
    const targetX = player.x + player.w / 2 - VIEW_W / 2;
    const targetY = player.y + player.h / 2 - VIEW_H / 2;
    camX = Math.max(0, Math.min(LEVEL_W - VIEW_W, targetX));
    camY = Math.max(0, Math.min(LEVEL_H - VIEW_H, targetY));
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#6cb4ff');
    g.addColorStop(1, '#bfe0ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Parallax clouds
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 220) - camX * 0.3) % (LEVEL_W + 400);
      const x = cx < -200 ? cx + LEVEL_W + 400 : cx;
      const y = 60 + (i % 3) * 40;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 18, y - 8, 22, 0, Math.PI * 2);
      ctx.arc(x + 38, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 20, y + 8, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWorld() {
    ctx.save();
    ctx.translate(-camX, -camY);

    // Solid blocks (brick-like)
    for (const s of merged) {
      // skip offscreen
      if (s.x + s.w < camX || s.x > camX + VIEW_W) continue;
      if (s.y + s.h < camY || s.y > camY + VIEW_H) continue;

      ctx.fillStyle = '#7a4a1c';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#5e3712';
      ctx.fillRect(s.x, s.y + s.h - 4, s.w, 4);
      // top grass if it's the top row of a stack
      ctx.fillStyle = '#3fa84a';
      ctx.fillRect(s.x, s.y, s.w, 6);
      ctx.fillStyle = '#2f8a3a';
      ctx.fillRect(s.x, s.y + 6, s.w, 2);

      // Brick lines
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 1;
      for (let y = s.y + TILE; y < s.y + s.h; y += TILE) {
        ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x + s.w, y); ctx.stroke();
      }
      for (let x = s.x + TILE; x < s.x + s.w; x += TILE) {
        ctx.beginPath(); ctx.moveTo(x, s.y); ctx.lineTo(x, s.y + s.h); ctx.stroke();
      }
    }

    // One-way platforms
    for (const p of oneways) {
      if (p.x + p.w < camX || p.x > camX + VIEW_W) continue;
      ctx.fillStyle = '#caa15a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#8a6a32';
      ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);
    }

    // Goal flag
    if (goal) {
      ctx.fillStyle = '#444';
      ctx.fillRect(goal.x + goal.w / 2 - 2, goal.y, 4, goal.h);
      ctx.fillStyle = player.won ? '#ffd84a' : '#e84a4a';
      ctx.beginPath();
      ctx.moveTo(goal.x + goal.w / 2 + 2, goal.y + 4);
      ctx.lineTo(goal.x + goal.w / 2 + 26, goal.y + 12);
      ctx.lineTo(goal.x + goal.w / 2 + 2, goal.y + 20);
      ctx.closePath();
      ctx.fill();
    }

    // Ghost behind player when non-solid (so the live player reads on top through the haze).
    if (ghost) drawGhost();

    // Player
    drawPlayer();

    // Confetti on top of everything in the world.
    drawConfetti();

    if (debug) {
      ctx.strokeStyle = '#ff0';
      ctx.strokeRect(player.x, player.y, player.w, player.h);
      if (ghost) {
        ctx.strokeStyle = ghost.solid ? '#0f0' : '#0ff';
        ctx.strokeRect(ghost.x, ghost.y, player.w, player.h);
      }
    }

    ctx.restore();
  }

  function drawCharacter(px, py, facing) {
    const x = Math.round(px), y = Math.round(py);
    // body
    ctx.fillStyle = '#e63946';
    ctx.fillRect(x, y + 8, player.w, player.h - 8);
    // head
    ctx.fillStyle = '#f4d29a';
    ctx.fillRect(x + 4, y, player.w - 8, 12);
    // hat
    ctx.fillStyle = '#b3001b';
    ctx.fillRect(x + 2, y, player.w - 4, 5);
    ctx.fillRect(x - 2, y + 3, player.w + 4, 3);
    // eye
    ctx.fillStyle = '#000';
    const eyeX = facing > 0 ? x + player.w - 8 : x + 6;
    ctx.fillRect(eyeX, y + 6, 2, 3);
    // shoes
    ctx.fillStyle = '#3b2a1a';
    ctx.fillRect(x, y + player.h - 4, 8, 4);
    ctx.fillRect(x + player.w - 8, y + player.h - 4, 8, 4);
  }

  function drawPlayer() {
    if (player.dead) return;
    drawCharacter(player.x, player.y, player.facing);
  }

  function drawGhost() {
    ctx.save();
    ctx.globalAlpha = ghost.solid ? 1.0 : 0.5;
    drawCharacter(ghost.x, ghost.y, ghost.facing);
    ctx.restore();
  }

  function drawConfetti() {
    for (const p of confetti) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.fillStyle = p.color;
      ctx.fillRect(-3, -2, 6, 4);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    const status = document.getElementById('status');
    const dbg = document.getElementById('debug');
    if (rewinding) status.textContent = `◀◀ REWIND  (${(hCount / 60).toFixed(1)}s left)`;
    else if (player.dead) status.textContent = 'You burst into confetti — hold Space to rewind';
    else if (player.won) status.textContent = 'You reached the goal! Press R to restart.';
    else status.textContent = 'Get to the flag →';
    if (debug) {
      dbg.textContent =
        `x:${player.x.toFixed(0)} y:${player.y.toFixed(0)} ` +
        `vx:${player.vx.toFixed(0)} vy:${player.vy.toFixed(0)} ` +
        `g:${player.onGround ? 1 : 0}`;
    } else {
      dbg.textContent = '';
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp big stalls

    update(dt);
    updateCamera();
    drawSky();
    drawWorld();
    if (rewinding) {
      ctx.fillStyle = 'rgba(80, 140, 255, 0.20)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    drawHUD();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
